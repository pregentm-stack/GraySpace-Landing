<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request Received | GraySpace SWG</title>

  <style>
    :root{
      --bg:#0b0f14; --text:#e7eef7; --muted:#9fb0c2; --warn:#f4c95d;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius2: 22px; --max: 1100px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family: var(--sans); color:var(--text); background:
      radial-gradient(1100px 600px at 15% -10%, rgba(183,199,221,.12), transparent 55%),
      radial-gradient(900px 500px at 90% 0%, rgba(244,201,93,.08), transparent 50%),
      var(--bg);
    }
    a{color:inherit; text-decoration:none}
    .wrap{max-width:var(--max); margin:0 auto; padding:0 20px}
    .card{margin:60px auto; padding:28px; max-width:820px; border-radius: var(--radius2);
      border:1px solid rgba(30,42,58,.8);
      background: linear-gradient(180deg, rgba(15,22,32,.78), rgba(12,18,27,.74));
      box-shadow: var(--shadow);
      text-align:center;
    }
    .kicker{font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase}
    h1{margin:10px 0 10px; font-size:34px; letter-spacing:-.02em}
    p{color:var(--muted); line-height:1.5}
    .btn{display:inline-flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px;
      font-size:13px; border:1px solid rgba(183,199,221,.18); background: rgba(15,22,32,.55);
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }
    .btn.primary{background: linear-gradient(145deg, rgba(183,199,221,.14), rgba(15,22,32,.62));}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <div class="kicker">Submission Confirmed</div>
      <h1>Request Received</h1>
      <p>Your submission has been received securely.</p>
      <p>GraySpace SWG will respond within 24 hours.</p>

      <div style="margin-top:16px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap">
        <a class="btn primary" href="/request-services/">Back to Request Services</a>
        <a class="btn" href="/">Home</a>
      </div>
    </div>
  </main>
</body>
</html>
